# 公共配置文件
# @author <a href="https://github.com/liyupi">程序员鱼皮</a>
# @from <a href="https://yupi.icu">编程导航知识星球</a>
spring:
  application:
    name: chart-core
  # 默认 dev 环境
  profiles:
    active: dev,local
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # session 配置
  session:
    # todo 取消注释开启分布式 session（须先配置 Redis）
    # store-type: redis
    # 30 天过期
    timeout: 2592000
  # 数据库配置
  # todo 需替换配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/chart_flow_db
    username: root
    password: 123456
    # HikariCP 连接池配置
    hikari:
      minimum-idle: 10       # 最小空闲连接数
      maximum-pool-size: 30  # 最大连接数
      idle-timeout: 30000    # 空闲连接超时时间（毫秒）
      connection-timeout: 30000 # 连接获取超时时间（毫秒）
      max-lifetime: 1800000  # 连接最大生命周期（毫秒）
  # Redis 配置
  redis:
    database: 1
    host: localhost
    port: 6379
    timeout: 5000
  # Elasticsearch 配置
  # todo 需替换配置，然后取消注释
#  elasticsearch:
#    uris: http://localhost:9200
#    username: root
#    password: 123456
  # 文件上传
  servlet:
    multipart:
      # 大小限制（支持更大的文件上传）
      max-file-size: 50MB
      max-request-size: 50MB
  rabbitmq:
    host: localhost
    port: 5672
    password: guest
    username: guest
server:
  address: 0.0.0.0
  port: 8101
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 对象存储
# todo 需替换配置
cos:
  client:
    accessKey: xxx
    secretKey: xxx
    region: xxx
    bucket: xxx
# 阿里云OSS配置
oss:
  accessKey: ${OSS_ACCESS_KEY:your-access-key}
  secretKey: ${OSS_SECRET_KEY:your-secret-key}
  endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
  bucket: ${OSS_BUCKET:web-talis-bucket}
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.chartflow.core.controller

logging:
  file:
    name: ./logs/application.log
  level:
    com.chartflow.core.aop.LogInterceptor: INFO # 日志级别配置
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  # 日志文件策略
  logback:
    rollingpolicy:
      max-file-size: 10MB    # 每个日志文件最大大小
      max-history: 30        # 保留最近30天的日志
      total-size-cap: 1GB    # 所有日志文件总大小上限
      file-name-pattern: logs/application-%d{yyyy-MM-dd}.%i.log

ollama:
  base-url: http://localhost:11434/v1
  model: qwen2.5:7b

# MCP 邮件服务配置
mcp:
  email:
    server-path: ./mcp_server/mcp_email_server.py
    smtp-server: smtp.qq.com
    smtp-port: 587
    smtp-user: ${MCP_SMTP_USER:}        # 从环境变量读取
    smtp-password: ${MCP_SMTP_PASSWORD:}  # 从环境变量读取

# 图表生成配置
chart:
#  default-prompt: |
#    你是一个数据分析师和前端开发专家，接下来我会按照以下固定格式给你提供内容：
#    分析需求：
#    {数据分析的需求或者目标}
#    原始数据：
#    {csv格式的原始数据，用,作为分隔符}
#    请根据这两部分内容，按照以下指定格式生成内容（此外不要输出任何多余的开头、结尾、注释）
#    【【【【【
#    {前端 Echarts V5 的 option 配置对象js代码，合理地将数据进行可视化，不要生成任何多余的内容，比如注释}
#    【【【【【
#    {明确的数据分析结论、越详细越好，不要生成多余的注释，比如注释}
  response-delimiter: "【【【【【"
  max-retry-count: 30
  retry-interval-ms: 2000

# ECharts Server 配置（用于生成图表图片）
echarts:
  server:
    script-path: mcp_server/generate_chart.js